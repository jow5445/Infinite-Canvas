<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Infinite Canvas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;

            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;

            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #ffffff;
        }

        .toolbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 10px 12px;

            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ddd;
            border-radius: 12px;

            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);

            z-index: 10;
        }

        .toolbar label {
            display: flex;
            align-items: center;
            gap: 7px;

            font-size: 14px;
            color: #333;
        }

        #colorPicker {
            width: 34px;
            height: 34px;

            padding: 2px;

            border: 1px solid #ccc;
            border-radius: 8px;

            background: white;
            cursor: pointer;
        }

        #sizePicker {
            width: 90px;
            cursor: pointer;
        }

        .size-value {
            min-width: 30px;
            font-size: 13px;
            color: #555;
        }

        .divider {
            width: 1px;
            height: 25px;
            background: #ddd;
        }

        button {
            border: 0;
            border-radius: 8px;

            padding: 9px 14px;

            background: #222;
            color: white;

            font-size: 14px;
            cursor: pointer;

            transition: background 0.15s ease;
        }

        button:hover {
            background: #444;
        }

        button:active {
            transform: translateY(1px);
        }

        @media (max-width: 600px) {
            .toolbar {
                top: 12px;
                padding: 8px;

                gap: 7px;
            }

            .toolbar label span {
                display: none;
            }

            #sizePicker {
                width: 70px;
            }

            button {
                padding: 9px 11px;
            }
        }
    </style>
</head>

<body>

<div class="toolbar">

    <label>
        <span>Color</span>
        <input type="color" id="colorPicker" value="#000000">
    </label>

    <div class="divider"></div>

    <label>
        <span>Size</span>
        <input
                type="range"
                id="sizePicker"
                min="1"
                max="20"
                value="2"
        >
    </label>

    <span class="size-value" id="sizeValue">2px</span>

    <div class="divider"></div>

    <button id="clearButton">
        Clear
    </button>

</div>

<canvas id="canvas">
    Your browser does not support HTML5 canvas.
</canvas>

<script>

    const canvas = document.getElementById("canvas");
    const context = canvas.getContext("2d");

    const colorPicker = document.getElementById("colorPicker");
    const sizePicker = document.getElementById("sizePicker");
    const sizeValue = document.getElementById("sizeValue");
    const clearButton = document.getElementById("clearButton");

    let currentColor = "#000000";
    let currentSize = 2;

    colorPicker.addEventListener("input", () => {
        currentColor = colorPicker.value;
    });

    sizePicker.addEventListener("input", () => {
        currentSize = Number(sizePicker.value);
        sizeValue.textContent = `${currentSize}px`;
    });


    document.oncontextmenu = function () {
        return false;
    };

    const drawings = [];

    let cursorX;
    let cursorY;

    let prevCursorX;
    let prevCursorY;

    let offsetX = 0;
    let offsetY = 0;

    let scale = 1;

    function toScreenX(xTrue) {
        return (xTrue + offsetX) * scale;
    }

    function toScreenY(yTrue) {
        return (yTrue + offsetY) * scale;
    }

    function toTrueX(xScreen) {
        return (xScreen / scale) - offsetX;
    }

    function toTrueY(yScreen) {
        return (yScreen / scale) - offsetY;
    }

    function trueHeight() {
        return canvas.clientHeight / scale;
    }

    function trueWidth() {
        return canvas.clientWidth / scale;
    }

    function drawLine(x0, y0, x1, y1, color = currentColor, size = currentSize) {

        context.beginPath();

        context.moveTo(x0, y0);
        context.lineTo(x1, y1);

        context.strokeStyle = color;
        context.lineWidth = size;

        context.lineCap = "round";
        context.lineJoin = "round";

        context.stroke();
    }

    function redrawCanvas() {

        canvas.width = document.body.clientWidth;
        canvas.height = document.body.clientHeight;

        context.fillStyle = "#ffffff";
        context.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        for (let i = 0; i < drawings.length; i++) {

            const line = drawings[i];

            drawLine(
                toScreenX(line.x0),
                toScreenY(line.y0),
                toScreenX(line.x1),
                toScreenY(line.y1),
                line.color,
                line.size * scale
            );
        }
    }

    redrawCanvas();

    window.addEventListener("resize", () => {
        redrawCanvas();
    });

    clearButton.addEventListener("click", () => {

        if (drawings.length === 0) {
            return;
        }

        drawings.length = 0;

        redrawCanvas();
    });

    canvas.addEventListener("mousedown", onMouseDown);
    canvas.addEventListener("mouseup", onMouseUp);
    canvas.addEventListener("mouseout", onMouseUp);
    canvas.addEventListener("mousemove", onMouseMove);
    canvas.addEventListener("wheel", onMouseWheel);

    let leftMouseDown = false;
    let rightMouseDown = false;

    function onMouseDown(event) {

        if (event.button === 0) {
            leftMouseDown = true;
            rightMouseDown = false;
        }

        if (event.button === 2) {
            rightMouseDown = true;
            leftMouseDown = false;
        }

        cursorX = event.pageX;
        cursorY = event.pageY;

        prevCursorX = event.pageX;
        prevCursorY = event.pageY;
    }

    function onMouseMove(event) {

        cursorX = event.pageX;
        cursorY = event.pageY;

        const scaledX = toTrueX(cursorX);
        const scaledY = toTrueY(cursorY);

        const prevScaledX = toTrueX(prevCursorX);
        const prevScaledY = toTrueY(prevCursorY);

        if (leftMouseDown) {

            drawings.push({
                x0: prevScaledX,
                y0: prevScaledY,
                x1: scaledX,
                y1: scaledY,

                color: currentColor,
                size: currentSize
            });

            drawLine(
                prevCursorX,
                prevCursorY,
                cursorX,
                cursorY
            );
        }

        if (rightMouseDown) {

            offsetX +=
                (cursorX - prevCursorX) / scale;

            offsetY +=
                (cursorY - prevCursorY) / scale;

            redrawCanvas();
        }

        prevCursorX = cursorX;
        prevCursorY = cursorY;
    }

    function onMouseUp() {

        leftMouseDown = false;
        rightMouseDown = false;
    }

    function onMouseWheel(event) {

        event.preventDefault();

        const deltaY = event.deltaY;

        const scaleAmount = -deltaY / 500;

        const oldScale = scale;

        scale = scale * (1 + scaleAmount);

        scale = Math.max(
            0.1,
            Math.min(scale, 10)
        );

        const actualScaleAmount =
            scale / oldScale - 1;

        const distX =
            event.pageX / canvas.clientWidth;

        const distY =
            event.pageY / canvas.clientHeight;

        const unitsZoomedX =
            trueWidth() * actualScaleAmount;

        const unitsZoomedY =
            trueHeight() * actualScaleAmount;

        offsetX -= unitsZoomedX * distX;
        offsetY -= unitsZoomedY * distY;

        redrawCanvas();
    }

    canvas.addEventListener("touchstart", onTouchStart);
    canvas.addEventListener("touchend", onTouchEnd);
    canvas.addEventListener("touchcancel", onTouchEnd);
    canvas.addEventListener("touchmove", onTouchMove);

    const prevTouches = [null, null];

    let singleTouch = false;
    let doubleTouch = false;

    function onTouchStart(event) {

        if (event.touches.length === 1) {

            singleTouch = true;
            doubleTouch = false;
        }

        if (event.touches.length >= 2) {

            singleTouch = false;
            doubleTouch = true;
        }

        prevTouches[0] = event.touches[0];
        prevTouches[1] = event.touches[1];
    }

    function onTouchMove(event) {

        const touch0X = event.touches[0].pageX;
        const touch0Y = event.touches[0].pageY;

        const prevTouch0X = prevTouches[0].pageX;
        const prevTouch0Y = prevTouches[0].pageY;

        const scaledX = toTrueX(touch0X);
        const scaledY = toTrueY(touch0Y);

        const prevScaledX = toTrueX(prevTouch0X);
        const prevScaledY = toTrueY(prevTouch0Y);

        if (singleTouch) {

            drawings.push({
                x0: prevScaledX,
                y0: prevScaledY,
                x1: scaledX,
                y1: scaledY,

                color: currentColor,
                size: currentSize
            });

            drawLine(
                prevTouch0X,
                prevTouch0Y,
                touch0X,
                touch0Y
            );
        }

        if (doubleTouch) {

            const touch1X = event.touches[1].pageX;
            const touch1Y = event.touches[1].pageY;

            const prevTouch1X = prevTouches[1].pageX;
            const prevTouch1Y = prevTouches[1].pageY;


            const midX =
                (touch0X + touch1X) / 2;

            const midY =
                (touch0Y + touch1Y) / 2;

            const prevMidX =
                (prevTouch0X + prevTouch1X) / 2;

            const prevMidY =
                (prevTouch0Y + prevTouch1Y) / 2;

            const hypot = Math.sqrt(
                Math.pow(touch0X - touch1X, 2) +
                Math.pow(touch0Y - touch1Y, 2)
            );

            const prevHypot = Math.sqrt(
                Math.pow(prevTouch0X - prevTouch1X, 2) +
                Math.pow(prevTouch0Y - prevTouch1Y, 2)
            );

            if (prevHypot > 0) {

                const zoomAmount =
                    hypot / prevHypot;

                const oldScale = scale;

                scale *= zoomAmount;

                scale = Math.max(
                    0.1,
                    Math.min(scale, 10)
                );


                const actualZoom =
                    scale / oldScale;


                const panX = midX - prevMidX;
                const panY = midY - prevMidY;

                offsetX += panX / scale;
                offsetY += panY / scale;


                const zoomRatioX =
                    midX / canvas.clientWidth;

                const zoomRatioY =
                    midY / canvas.clientHeight;

                const zoomChange =
                    actualZoom - 1;

                offsetX -=
                    trueWidth() *
                    zoomChange *
                    zoomRatioX;

                offsetY -=
                    trueHeight() *
                    zoomChange *
                    zoomRatioY;
            }

            redrawCanvas();
        }

        prevTouches[0] = event.touches[0];
        prevTouches[1] = event.touches[1];
    }

    function onTouchEnd() {

        singleTouch = false;
        doubleTouch = false;
    }

</script>
</body>
</html>
