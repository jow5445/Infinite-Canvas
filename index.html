<!doctypehtml><html lang=en><meta charset=UTF-8><meta content="width=device-width,initial-scale=1"name=viewport><title>Infinite Canvas</title><style>*{box-sizing:border-box}body,html{width:100%;height:100%;margin:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Arial,sans-serif;background:#f5f5f5}canvas{display:block;width:100%;height:100%;background:#fff}.toolbar{position:fixed;top:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,.95);border:1px solid #ddd;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.08);z-index:10}.toolbar label{display:flex;align-items:center;gap:7px;font-size:14px;color:#333}#c{width:34px;height:34px;padding:2px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer}#s{width:90px;cursor:pointer}.v{min-width:30px;font-size:13px;color:#555}.d{width:1px;height:25px;background:#ddd}button{border:0;border-radius:8px;padding:9px 14px;background:#222;color:#fff;font-size:14px;cursor:pointer;transition:background .15s}button:hover{background:#444}button:active{transform:translateY(1px)}@media(max-width:600px){.toolbar{top:12px;padding:8px;gap:7px}.toolbar label span{display:none}#s{width:70px}button{padding:9px 11px}}</style><div class=toolbar><label><span>Color</span><input id=c type=color value=#000000></label><div class=d></div><label><span>Size</span><input id=s type=range value=2 max=20 min=1></label><span class=v id=v>2px</span><div class=d></div><button id=b>Clear</button></div><canvas id=cv></canvas><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),cp=document.getElementById("c"),sp=document.getElementById("s"),sv=document.getElementById("v"),cb=document.getElementById("b");
let col="#000000",sz=2,D=[],cx,cy,px,py,ox=0,oy=0,sc=1,lD=false,rD=false,pT=[null,null],sT=false,dT=false;
cp.oninput=()=>col=cp.value;
sp.oninput=()=>{sz=+sp.value;sv.textContent=sz+"px"};
document.oncontextmenu=()=>false;
const toSX=x=>(x+ox)*sc,toSY=y=>(y+oy)*sc,toTX=x=>(x/sc)-ox,toTY=y=>(y/sc)-oy,tH=()=>cv.clientHeight/sc,tW=()=>cv.clientWidth/sc;
function dL(x0,y0,x1,y1,c=col,s=sz){ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.strokeStyle=c;ctx.lineWidth=s;ctx.lineCap=ctx.lineJoin="round";ctx.stroke()}
function render(){cv.width=document.body.clientWidth;cv.height=document.body.clientHeight;ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);for(let i=0;i<D.length;i++){const l=D[i];dL(toSX(l.x0),toSY(l.y0),toSX(l.x1),toSY(l.y1),l.c,l.s*sc)}}
render();
window.onresize=render;
cb.onclick=()=>{if(!D.length)return;D.length=0;render()};
cv.onmousedown=e=>{if(e.button===0){lD=true;rD=false}if(e.button===2){rD=true;lD=false}cx=px=e.pageX;cy=py=e.pageY};
cv.onmousemove=e=>{cx=e.pageX;cy=e.pageY;const sx=toTX(cx),sy=toTY(cy),psx=toTX(px),psy=toTY(py);if(lD){D.push({x0:psx,y0:psy,x1:sx,y1:sy,c:col,s:sz});dL(px,py,cx,cy)}if(rD){ox+=(cx-px)/sc;oy+=(cy-py)/sc;render()}px=cx;py=cy};
cv.onmouseup=cv.onmouseout=()=>{lD=rD=false};
cv.onwheel=e=>{e.preventDefault();const oSc=sc;sc=Math.max(0.1,Math.min(sc*(1-e.deltaY/500),10));const aS=sc/oSc-1;ox-=tW()*aS*(e.pageX/cv.clientWidth);oy-=tH()*aS*(e.pageY/cv.clientHeight);render()};
cv.ontouchstart=e=>{sT=e.touches.length===1;dT=e.touches.length>=2;pT[0]=e.touches[0];pT[1]=e.touches[1]};
cv.ontouchmove=e=>{const t0=e.touches[0],p0=pT[0],sx=toTX(t0.pageX),sy=toTY(t0.pageY),psx=toTX(p0.pageX),psy=toTY(p0.pageY);if(sT){D.push({x0:psx,y0:psy,x1:sx,y1:sy,c:col,s:sz});dL(p0.pageX,p0.pageY,t0.pageX,t0.pageY)}if(dT){const t1=e.touches[1],p1=pT[1],mx=(t0.pageX+t1.pageX)/2,my=(t0.pageY+t1.pageY)/2,pmx=(p0.pageX+p1.pageX)/2,pmy=(p0.pageY+p1.pageY)/2,h=Math.hypot(t0.pageX-t1.pageX,t0.pageY-t1.pageY),ph=Math.hypot(p0.pageX-p1.pageX,p0.pageY-p1.pageY);if(ph>0){const oSc=sc;sc=Math.max(0.1,Math.min(sc*(h/ph),10));const aZ=sc/oSc;ox+=(mx-pmx)/sc-(tW()*(aZ-1)*(mx/cv.clientWidth));oy+=(my-pmy)/sc-(tH()*(aZ-1)*(my/cv.clientHeight))}render()}pT[0]=t0;pT[1]=e.touches[1]};
cv.ontouchend=cv.ontouchcancel=()=>{sT=dT=false};</script>
